# What tool/devices.sh runs in this project: the frame benchmark, which
# plays every animated scene and times each frame on the device.
TARGET=integration_test/frames_test.dart
DRIVER=test_driver/frames_driver.dart
MODE=--profile
DEFINES=(--dart-define=FRAMES_REAL_DEVICE=true)
RESULT=build/frames.json
REPORT="python3 tool/frames/report.py"
SUMMARY="python3 tool/frames/summary.py"
COMPARE="python3 tool/frames/compare.py"
# The game ships on the web; the Android app is there to run by name.
PLATFORMS="android-chrome iphone chrome safari macos"
LIMIT_MIN=30
BROWSER_SIZE=1440,900
