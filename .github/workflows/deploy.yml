name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # To publish what it found to the ci-main branch.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true
      - run: flutter pub get
      # Problems become annotations on the run, so they can be read without
      # downloading the logs.
      - name: Analyze
        run: |
          dart analyze --format=machine --fatal-infos --fatal-warnings 2>&1 | tee analyze.txt || true
          awk -F'|' 'NF>=8 {lvl=($1=="ERROR")?"error":"warning"; f=$4; sub(".*/kings-court/kings-court/","",f); printf "::%s file=%s,line=%s,col=%s::%s (%s)\n", lvl, f, $5, $6, $8, $3}' analyze.txt | head -50
          ! grep -q '|' analyze.txt
      - name: Test
        run: |
          set +e
          timeout 600 flutter test --exclude-tags tool --timeout 60s --reporter expanded > test.txt 2>&1
          code=$?
          tail -5 test.txt
          if [ $code -ne 0 ]; then python3 tool/ci_annotate.py test.txt; fi
          exit $code
      # What the analyzer and the tests said, on the ci-main branch, so it
      # can be read where the run's logs can't.
      - name: Publish to the ci-main branch
        if: always()
        run: |
          mkdir -p /tmp/out
          cp analyze.txt test.txt /tmp/out/ 2>/dev/null || true
          { echo "commit ${GITHUB_SHA}"; grep -cE '\|' analyze.txt 2>/dev/null | sed 's/^/analyzer issues: /'; tail -3 test.txt 2>/dev/null; } > /tmp/out/summary.txt
          cd /tmp/out
          git init -q -b ci-main
          git config user.name ci && git config user.email ci@example.com
          git add -A && git commit -qm "Test and deploy for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-main || echo "::warning::Could not publish ci-main"

  # Builds and publishes even if a test fails, so there's always something
  # to play; the test job shows what broke.
  build:
    runs-on: ubuntu-latest
    # To publish its log to the ci-main-build branch.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true
      - run: flutter pub get
      # BUILD names the commit in bug reports; BUG_URL is where they go (the
      # repo variable BUG_REPORT_URL, the Cloudflare Worker in tool/bug_worker).
      - name: Build
        run: |
          set -o pipefail
          # --wasm: WebAssembly as well as JavaScript; web/flutter_bootstrap.js
          # picks which a browser gets.
          # --no-web-resources-cdn: the renderer from the site itself, not
          # Google's servers, so the page can be isolated (web/_headers) and
          # still load it. At the root of its address on Cloudflare Pages.
          flutter build web --release --wasm --no-web-resources-cdn --base-href / \
            --dart-define=BUILD=${GITHUB_SHA::8} \
            --dart-define=BUG_URL=${{ vars.BUG_REPORT_URL }} \
            --dart-define=SENTRY_DSN=${{ vars.SENTRY_DSN }} \
            --dart-define=GOATCOUNTER=${{ vars.GOATCOUNTER_CODE }} \
            --source-maps 2>&1 | tee build.txt
          # How much a player downloads: the game's code, and everything.
          { echo; echo "main.dart.js: $(du -k build/web/main.dart.js | cut -f1) KB, main.dart.wasm: $(du -k build/web/main.dart.wasm | cut -f1) KB"; echo "the whole site: $(du -sk build/web | cut -f1) KB (with source maps)"; } | tee -a build.txt
      # Source maps go to Sentry (when it's set up) so crash reports show the
      # Dart lines, then are left off the published site.
      - name: Upload source maps
        if: ${{ vars.SENTRY_DSN != '' }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          if [ -n "$SENTRY_AUTH_TOKEN" ]; then
            SENTRY_RELEASE=kings-court@${GITHUB_SHA::8} dart run sentry_dart_plugin
          else
            echo "::warning::SENTRY_AUTH_TOKEN not set; crash reports will show compiled JS lines"
          fi
      - run: find build/web -name '*.map' -delete
      # Give each build's files a version so browsers fetch the new ones
      # instead of a cached copy.
      - name: Bust caches
        run: |
          v=${GITHUB_SHA::8}
          sed -i "s/main\.dart\.js/main.dart.js?v=$v/g; s/main\.dart\.wasm/main.dart.wasm?v=$v/g; s/main\.dart\.mjs/main.dart.mjs?v=$v/g" build/web/flutter_bootstrap.js
          sed -i "s/flutter_bootstrap\.js/flutter_bootstrap.js?v=$v/" build/web/index.html
          # The commit this page was built from, for Pocket Lab's results.
          sed -i "s|<meta charset=\"UTF-8\">|<meta charset=\"UTF-8\">\n  <meta name=\"build\" content=\"$GITHUB_SHA\">|" build/web/index.html
          grep -c 'name="build"' build/web/index.html
          rm -f build/web/flutter_service_worker.js
          grep -o 'main.dart.[a-z]*js[^"]*\|main.dart.wasm[^"]*' build/web/flutter_bootstrap.js | head -4
      # GitHub Pages now only sends old addresses on to Cloudflare Pages,
      # where the game is (tool/redirect).
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tool/redirect
      # The game, for Cloudflare Pages (the cloudflare job).
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: build/web
          retention-days: 3
      - name: Publish to the ci-main-build branch
        if: always()
        run: |
          mkdir -p /tmp/out && cp build.txt /tmp/out/ 2>/dev/null || echo "no build log" > /tmp/out/build.txt
          cd /tmp/out
          git init -q -b out
          git config user.name ci && git config user.email ci@example.com
          git add -A && git commit -qm "Build for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" out:ci-main-build || echo "::warning::Could not publish ci-main-build"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  # The game, on Cloudflare Pages (the project kings-court, made the first
  # time): where it's played, at kings-court-c8n.pages.dev. Cross-origin
  # isolated (web/_headers), so the WebAssembly build can run on several
  # threads, which GitHub Pages can't allow. Uses the Cloudflare secrets the
  # web service does (its token needs Cloudflare Pages: Edit). What
  # happened goes to the cloudflare branch (status.txt).
  cloudflare:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx --yes wrangler@4.86.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy
        run: |
          mkdir -p out
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Not set up: no Cloudflare secrets" | tee out/status.txt; exit 0
          fi
          cp web/_headers site/_headers
          $WRANGLER pages project list 2>&1 | tee out/projects.txt | grep -q ' kings-court ' \
            || $WRANGLER pages project create kings-court --production-branch main 2>&1 | tee -a out/projects.txt
          set -o pipefail
          if $WRANGLER pages deploy site --project-name kings-court --branch main \
               --commit-hash "$GITHUB_SHA" --commit-message "${GITHUB_SHA::8}" 2>&1 | tee out/deploy.txt; then
            echo "deployed ${GITHUB_SHA::8}" > out/status.txt
            grep -oE 'https://[a-z0-9.-]+\.pages\.dev' out/deploy.txt | head -1 >> out/status.txt
          else
            echo "failed: see deploy.txt (the token may need Cloudflare Pages: Edit)" > out/status.txt
            exit 1
          fi
      - name: Publish to the cloudflare branch
        if: always()
        run: |
          mkdir -p out && cd out
          git init -q -b cloudflare
          git config user.name ci && git config user.email ci@example.com
          git add -A && git commit -qm "Cloudflare Pages for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" cloudflare || true
