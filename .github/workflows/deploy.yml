name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true
      - run: flutter pub get
      # Problems become annotations on the run, so they can be read without
      # downloading the logs.
      - name: Analyze
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings --format=machine 2>&1 | tee analyze.txt || true
          awk -F'|' 'NF>=8 && ($1=="ERROR" || $1=="WARNING") {lvl=($1=="ERROR")?"error":"warning"; f=$4; sub(".*/kings-court/kings-court/","",f); printf "::%s file=%s,line=%s,col=%s::%s (%s)\n", lvl, f, $5, $6, $8, $3}' analyze.txt
          ! grep -q '^ERROR|' analyze.txt
      - name: Test
        run: |
          set +e
          flutter test --reporter expanded > test.txt 2>&1
          code=$?
          tail -5 test.txt
          if [ $code -ne 0 ]; then
            # The failures, with context, as one annotation per failing test.
            awk '/\[E\]$/ {if (buf!="") print buf; buf=$0; n=1; next}
                 buf!="" && n<60 {buf=buf"%0A"$0; n++}
                 END {if (buf!="") print buf}' test.txt | head -20 | sed 's/^/::error::/'
          fi
          exit $code

  # Builds and publishes even if a test fails, so there's always something
  # to play; the test job shows what broke.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --base-href /kings-court/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
