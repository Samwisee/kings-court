name: Frames

# The frame benchmark (integration_test/frames_test.dart): the game in
# Chrome, every animation played, each frame timed. frames.txt is
# published to the out-frames-<branch> branch. It runs on every try-*
# branch beside Check a branch, and on main; its budget
# (tool/frames/budget.py) is a gate like the tests.
on:
  push:
    branches: [main, 'frames-*', 'try-*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frames-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frames:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Play every animation
        run: |
          "$CHROMEWEBDRIVER/chromedriver" --port=4444 > chromedriver.log 2>&1 &
          # The test's progress (Frames.log), kept even if it hangs.
          python3 -c "
          import http.server, time
          class H(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  n = int(self.headers.get('Content-Length', 0))
                  open('progress.txt', 'a').write(time.strftime('%H:%M:%S ') + self.rfile.read(n).decode(errors='replace') + chr(10))
                  self.send_response(204); self.end_headers()
              def log_message(self, *a): pass
          http.server.HTTPServer(('localhost', 9999), H).serve_forever()
          " > logserver.txt 2>&1 &
          sleep 2
          set +e
          # No GPU here, so WebGL is emulated (SwiftShader), far slower than
          # a phone's GPU: drawn at 1x to keep frames coming. The work
          # numbers (build, layout, paint) are the ones to trust; real
          # devices' raster times come from the reports branch.
          timeout 900 flutter drive --profile -d web-server --browser-name=chrome --driver-port=4444 \
            --browser-dimension=412,915@1 \
            --web-browser-flag=--enable-unsafe-swiftshader --web-browser-flag=--ignore-gpu-blocklist \
            --driver=test_driver/frames_driver.dart --target=integration_test/frames_test.dart > drive.txt 2>&1
          echo "flutter drive exited $?"
          grep -E 'FRAMES|rror|Exception|fail' drive.txt | head -60
          tail -20 drive.txt
          python3 tool/frames/report.py build/frames.json > frames.txt 2>&1 || cp drive.txt frames.txt
          cat frames.txt
      - name: Within the frame budget?
        run: |
          set -o pipefail
          python3 tool/frames/budget.py build/frames.json | tee budget.txt
      - name: Publish to the frames branch
        if: always()
        run: |
          mkdir -p /tmp/out
          for f in frames.txt budget.txt drive.txt chromedriver.log progress.txt logserver.txt build/frames.json; do cp "$f" /tmp/out/ 2>/dev/null || true; done
          cd /tmp/out
          git init -q -b out
          git config user.name ci && git config user.email ci@example.com
          git add -A && git commit -qm "Frames for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" "out:out-frames-${GITHUB_REF_NAME#frames-}"
