name: Balance

# Bots play many rounds to see how winnable the task mix is. Runs when the
# tasks or the rules change, or by hand; the report goes to the balance
# branch (latest.txt, plus one file per commit).
on:
  push:
    branches: [main]
    paths:
      - 'lib/engine/**'
      - 'lib/game/**'
      - 'test/tool/balance_test.dart'
      - 'test/tool/play_round.dart'
  workflow_dispatch:
    inputs:
      seconds:
        description: 'How long to play for, in seconds'
        default: '900'

permissions:
  contents: write

concurrency:
  group: balance
  cancel-in-progress: true

jobs:
  balance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Play
        env:
          BALANCE_SECONDS: ${{ github.event.inputs.seconds || '900' }}
        run: |
          timeout 2100 flutter test test/tool/balance_test.dart --timeout none --reporter expanded > balance.txt 2>&1 || true
          tail -20 balance.txt
          python3 tool/ci_annotate.py balance.txt || true
      - name: Publish to the balance branch
        run: |
          v=${GITHUB_SHA::8}
          url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          mkdir -p /tmp/old /tmp/out
          # Keep the earlier reports, then publish a fresh branch with them.
          git clone -q --depth 1 --branch balance "$url" /tmp/old 2>/dev/null && cp /tmp/old/*.txt /tmp/out/ 2>/dev/null || true
          if [ -f test/tool/out/report.txt ]; then cp test/tool/out/report.txt /tmp/out/latest.txt; else cp balance.txt /tmp/out/latest.txt; fi
          cp /tmp/out/latest.txt /tmp/out/report-$v.txt
          cd /tmp/out
          git init -q -b balance
          git config user.name ci && git config user.email ci@example.com
          git add -A && git commit -qm "Balance report for ${GITHUB_SHA}"
          git push -qf "$url" balance || echo "::error::Could not publish the balance report"
