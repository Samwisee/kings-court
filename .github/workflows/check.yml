name: Check a branch

# Analyze, test and build on any branch but main (main runs them in
# deploy.yml), compare every screenshot with the baseline, and time main
# against the branch. Each job publishes its full output to a branch of
# its own (ci-<branch>, shots-<branch>, bench-<branch>), so results can be
# read from a session where the logs can't be.
on:
  push:
    branches-ignore: [main, 'ci-*', 'shots*', 'bench*', balance, fixtures, 'fix-*', 'fixed-*', service]

permissions:
  contents: write

# One run at a time per branch, and every pushed commit gets its run (a
# commit must be green on its own, so a newer push doesn't cancel it).
concurrency:
  group: check-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: |
          mkdir -p out
          dart analyze --format=machine --fatal-infos --fatal-warnings 2>&1 | tee out/analyze.txt || true
          awk -F'|' 'NF>=8 {lvl=($1=="ERROR")?"error":"warning"; f=$4; sub(".*/kings-court/kings-court/","",f); printf "::%s file=%s,line=%s,col=%s::%s (%s)\n", lvl, f, $5, $6, $8, $3}' out/analyze.txt | head -50
          echo "analyzer issues: $(grep -c '|' out/analyze.txt || true)" | tee -a out/summary.txt
          ! grep -q '|' out/analyze.txt
      - name: Test
        if: success() || failure()
        run: |
          set +e
          timeout 900 flutter test --exclude-tags tool --timeout 60s --coverage --reporter expanded > out/test.txt 2>&1
          code=$?
          # How much of lib/ the tests run (tool/coverage.py).
          if [ -f coverage/lcov.info ]; then python3 tool/coverage.py coverage/lcov.info > out/coverage.txt; head -1 out/coverage.txt | tee -a out/summary.txt; cp coverage/lcov.info out/; fi
          tail -5 out/test.txt | tee -a out/summary.txt
          if [ $code -ne 0 ]; then python3 tool/ci_annotate.py out/test.txt; fi
          exit $code
      - name: Write the save fixtures for the current version
        if: success() || failure()
        run: |
          timeout 300 flutter test test/tool/make_saves_test.dart --reporter expanded > out/fixtures.txt 2>&1 || tail -5 out/fixtures.txt
          cp -r test/tool/out/fixtures out/ 2>/dev/null || true
      # The headless runner (bin/selfplay.dart): a few seeds on two cores,
      # taught, and its report, so a change that breaks either shows here.
      - name: The headless runner
        run: |
          set -o pipefail
          timeout 300 dart run bin/selfplay.dart --seeds 4 --rungs weak,casual,fixed --workers 2 --teach --out out/selfplay/rounds.jsonl 2>&1 | tail -6 | tee out/selfplay.txt
          python3 tool/selfplay/curves.py out/selfplay/rounds.jsonl 2>&1 | tee -a out/selfplay.txt
          test "$(wc -l < out/selfplay/rounds.jsonl)" -ge 12
          rm -rf out/selfplay
      - name: Build
        if: success() || failure()
        run: flutter build web --release --base-href /kings-court/ --dart-define=BUILD=${GITHUB_SHA::8} > out/build.txt 2>&1 || (tail -20 out/build.txt; exit 1)
      - name: Publish the output to ci-${{ github.ref_name }}
        if: always()
        run: |
          cd out
          git init -q -b "ci-${GITHUB_REF_NAME}"
          git config user.name ci && git config user.email ci@example.com
          git add -A && git commit -qm "Check of ${GITHUB_SHA}"
          # Retried: pushes from runs side by side sometimes fail at first.
          for i in 1 2 3 4 5; do git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" "ci-${GITHUB_REF_NAME}" && exit 0; sleep $((i * 5)); done; exit 1

  service:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: The web service's tests (rooms)
        run: node --test tool/bug_worker/rooms.test.mjs

  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Take screenshots
        run: |
          mkdir -p out
          timeout 900 flutter test test/tool/shots_test.dart --update-goldens --reporter expanded > out/shots.txt 2>&1 || true
          tail -5 out/shots.txt
          python3 tool/ci_annotate.py out/shots.txt || true
          cp test/tool/goldens/*.png out/ 2>/dev/null || true
      - name: Compare with the baseline
        id: compare
        run: |
          pip install --quiet pillow
          if git fetch --depth=1 origin shots-baseline 2>/dev/null; then
            mkdir -p /tmp/baseline && git --work-tree=/tmp/baseline checkout FETCH_HEAD -- . && echo "baseline $(git rev-parse FETCH_HEAD)" > out/compare.txt
          else
            echo "no baseline branch" > out/compare.txt
          fi
          set +e
          python3 tool/shots/compare.py /tmp/baseline test/tool/goldens tool/shots/expected_changes.txt out >> out/compare.txt
          echo "code=$?" >> "$GITHUB_OUTPUT"
          grep -v '^same' out/compare.txt | head -80
      - name: Publish to shots-${{ github.ref_name }}
        if: always()
        run: |
          cd out
          git init -q -b "shots-${GITHUB_REF_NAME}"
          git config user.name ci && git config user.email ci@example.com
          git add -A && git commit -qm "Screenshots for ${GITHUB_SHA}"
          # Retried: pushes from runs side by side sometimes fail at first.
          for i in 1 2 3 4 5; do git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" "shots-${GITHUB_REF_NAME}" && exit 0; sleep $((i * 5)); done; exit 1
      - name: Every difference must be explained
        run: test "${{ steps.compare.outputs.code }}" = "0"

  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: base
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true
      - run: flutter pub get && (cd base && flutter pub get)
      - name: Time main and the branch, twice each, on this runner
        run: |
          mkdir -p out
          # The benchmarks live under test/tool (before the refactor, tool/bench).
          where() { ls "$1/test/tool/$2" "$1/tool/bench/$2" 2>/dev/null | head -1 | sed "s|^$1/||"; }
          bench() {
            echo "== $1: the page, mid-round (phone size) ==" >> out/bench-compare.txt
            (cd $2 && timeout 300 flutter test "$(where . page_bench_test.dart)" --reporter expanded 2>&1 | grep -E '^BENCH|\[E\]' | sed 's/^BENCH //') >> out/bench-compare.txt || true
            echo "== $1: bots, on the Dart VM ==" >> out/bench-compare.txt
            (cd $2 && timeout 300 flutter test "$(where . bot_bench_test.dart)" --reporter expanded 2>&1 | grep -E '^BENCH|\[E\]' | sed 's/^BENCH //') >> out/bench-compare.txt || true
          }
          for round in 1 2; do
            bench "main (run $round)" base
            bench "branch (run $round)" .
          done
          cat out/bench-compare.txt
      - name: The budget (the branch may not be 30% slower than main on both runs)
        id: budget
        run: |
          set +e
          python3 tool/bench/budget.py out/bench-compare.txt | tee out/budget.txt
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Publish to bench-${{ github.ref_name }}
        if: always()
        run: |
          cd out
          git init -q -b "bench-${GITHUB_REF_NAME}"
          git config user.name ci && git config user.email ci@example.com
          git add -A && git commit -qm "Benchmarks for ${GITHUB_SHA}"
          # Retried: pushes from runs side by side sometimes fail at first.
          for i in 1 2 3 4 5; do git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" "bench-${GITHUB_REF_NAME}" && exit 0; sleep $((i * 5)); done; exit 1
      - name: The budget must be kept
        run: test "${{ steps.budget.outputs.code }}" = "0"
