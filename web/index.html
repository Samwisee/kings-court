<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- The phone's own width from the start: without it the loading crown
       is drawn on a desktop-width page, then jumps bigger when the game
       sets the viewport. (These are the values the game sets.) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="A cooperative trick-taking game for 2–6 players.">
  <!-- How a shared link looks in messages and social posts. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="The King's Court">
  <meta property="og:title" content="The King's Court">
  <meta property="og:description" content="A cooperative trick-taking game for 2–6 players.">
  <meta property="og:url" content="https://samwisee.github.io/kings-court/">
  <meta property="og:image" content="https://samwisee.github.io/kings-court/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="The Joker, Jack, Queen and King Court Cards fanned above the title The King's Court">
  <meta name="twitter:card" content="summary_large_image">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="King's Court">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=2">

  <!-- Favicon -->
  <!-- (?v= so browsers that kept Flutter's old icon fetch this one.) -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2"/>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=2"/>
  <meta name="theme-color" content="#4E0B18">

  <title>The King's Court</title>
  <link rel="manifest" href="manifest.json">
  <!-- The dark red table behind everything, so the browser bars and the edges of the
       screen match the table round the felt, and nothing flashes white while
       the game loads. -->
  <!-- The look saved last time (shared_preferences keeps it in local
       storage), so the loading screen is in that skin's colours, not
       always the court's. Each skin's values are its Skin's table,
       feltGlow, feltDeep and gold, and whether the felt sits in a rim;
       test/skin_test.dart checks they match the Dart. -->
  <script>
    (function () {
      var looks = {
        court: {table: '#4E0B18', glow: '#176141', deep: '#0A3622', gold: '#D4A63A', rim: 1, hi: '#F9E08C', lo: '#A57C1B'},
        plain: {table: '#151B24', glow: '#364150', deep: '#1A2230', gold: '#8DB4FF', rim: 0},
        lacquer: {table: '#0D0606', glow: '#4C2326', deep: '#26090B', gold: '#DDB65E', rim: 1},
        garden: {table: '#1B2418', glow: '#4E6B54', deep: '#29402E', gold: '#E5A88E', rim: 1},
        midnight: {table: '#07090F', glow: '#2A354E', deep: '#0E172C', gold: '#C9D2E3', rim: 1},
        harbour: {table: '#0B1A22', glow: '#274F5D', deep: '#0C2B36', gold: '#F2B950', rim: 0},
        velvet: {table: '#140A18', glow: '#4D3556', deep: '#28152F', gold: '#E5C07B', rim: 1},
        counting: {table: '#1A0A0C', glow: '#672C36', deep: '#3A0E16', gold: '#D4A63A', rim: 1},
        library: {table: '#1E140D', glow: '#674D3B', deep: '#3C291B', gold: '#D4A63A', rim: 1},
        tavern: {table: '#1A110A', glow: '#584232', deep: '#2E1F14', gold: '#E0A84E', rim: 0},
        marble: {table: '#0D1714', glow: '#314B43', deep: '#132621', gold: '#D9C9A0', rim: 1},
        ballroom: {table: '#000000', glow: '#2A2A2A', deep: '#0C0C0C', gold: '#D4A63A', rim: 1},
        courtyard: {table: '#0A1626', glow: '#2A4A6B', deep: '#0E2640', gold: '#F2C46D', rim: 0},
        campaign: {table: '#1A2012', glow: '#4A583D', deep: '#253019', gold: '#E8D49A', rim: 1},
        chequers: {table: '#120707', glow: '#4A2C30', deep: '#24100F', gold: '#D4A63A', rim: 1},
        salon: {table: '#0A0A0A', glow: '#373737', deep: '#171717', gold: '#ECE4D4', rim: 0}
      };
      // A table once chosen apart from the skin, saved as "+t:<table>": the
      // skin it became (lib/skin/skins.dart).
      var tableSkins = {sage: 'garden', teal: 'harbour', navy: 'midnight', plum: 'velvet',
        burgundy: 'counting', walnut: 'library', tavern: 'tavern', marble: 'marble', deco: 'ballroom',
        tiles: 'courtyard', map: 'campaign', chess: 'chequers', charcoal: 'salon'};
      var id = 'court';
      try { id = JSON.parse(localStorage.getItem('flutter.kingsCourt.skin')) || id; } catch (e) {}
      var parts = String(id).split('+');
      var room = parts[0];
      parts.forEach(function (p) {
        if (p.indexOf('t:') === 0 && tableSkins[p.slice(2)]) room = tableSkins[p.slice(2)];
      });
      var l = Object.assign({}, looks[room] || looks.court);
      var root = document.documentElement.style;
      root.setProperty('--table', l.table);
      root.setProperty('--glow', l.glow);
      root.setProperty('--deep', l.deep);
      root.setProperty('--gold', l.gold);
      root.setProperty('--rule', l.rim ? l.gold : 'transparent');
      // The crown's gilt, light to dark: the court's own, or the accent's.
      root.setProperty('--gold-hi', l.hi || 'color-mix(in srgb, ' + l.gold + ' 55%, white)');
      root.setProperty('--gold-lo', l.lo || 'color-mix(in srgb, ' + l.gold + ' 70%, black)');
      root.setProperty('--inset', l.rim ? '7px' : '0px');
      root.setProperty('--radius', l.rim ? '16px' : '0px');
      var bar = document.querySelector('meta[name="theme-color"]');
      if (bar) bar.setAttribute('content', l.table);
    })();
  </script>
  <style>
    html, body { margin: 0; background: var(--table, #4E0B18); }
    /* The court's own mouse pointers: a gilt arrow, and a gilt hand over
       anything you can press (Flutter marks those with an inline
       "cursor: pointer" on its view, which these win over). The art is
       cursors/*.svg; the PNGs are drawn from it at 1x and 2x. */
    html, body, [style*="cursor: default"] {
      cursor: url(cursors/arrow.png) 3 2, default;
      cursor: -webkit-image-set(url(cursors/arrow.png) 1x, url(cursors/arrow@2x.png) 2x) 3 2, default;
      cursor: image-set(url(cursors/arrow.png) 1x, url(cursors/arrow@2x.png) 2x) 3 2, default;
    }
    [style*="cursor: default"] { cursor: url(cursors/arrow.png) 3 2, default !important; }
    [style*="cursor: pointer"] {
      cursor: url(cursors/hand.png) 13 2, pointer !important;
      cursor: -webkit-image-set(url(cursors/hand.png) 1x, url(cursors/hand@2x.png) 2x) 13 2, pointer !important;
      cursor: image-set(url(cursors/hand.png) 1x, url(cursors/hand@2x.png) 2x) 13 2, pointer !important;
    }
    /* While the game loads: a gold crown on the felt, rising and glowing,
       which fades away as the first frame appears. */
    #loading {
      position: fixed; inset: var(--inset, 7px); border-radius: var(--radius, 16px);
      background: radial-gradient(circle at 50% 45%, var(--glow, #176141), var(--deep, #0A3622) 70%);
      box-shadow: inset 0 0 0 1.5px rgba(212,166,58,.8);
      box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--rule, #D4A63A) 80%, transparent);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 10; transition: opacity .7s ease; will-change: opacity;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading svg {
      width: 96px; filter: drop-shadow(0 0 14px rgba(212,166,58,.55));
      filter: drop-shadow(0 0 14px color-mix(in srgb, var(--gold, #D4A63A) 55%, transparent));
      animation: rise 1.6s ease-in-out infinite;
      will-change: transform;
    }
    #loading .dots { margin-top: 22px; display: flex; gap: 9px; }
    #loading .dots i {
      width: 8px; height: 8px; border-radius: 50%; background: var(--gold, #D4A63A);
      animation: blink 1.2s ease-in-out infinite;
    }
    #loading .dots i:nth-child(2) { animation-delay: .2s; }
    #loading .dots i:nth-child(3) { animation-delay: .4s; }
    @keyframes rise {
      0%, 100% { transform: translateY(4px) scale(.96); opacity: .85; }
      50% { transform: translateY(-6px) scale(1.04); opacity: 1; }
    }
    @keyframes blink { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      #loading svg, #loading .dots i { animation: none; }
    }
    /* Opened inside another app (a link in Messenger, Instagram…): a note
       that the game runs smoother in the phone's own browser. */
    #inapp {
      position: fixed; left: 12px; right: 12px; bottom: calc(14px + env(safe-area-inset-bottom));
      z-index: 20; display: flex; align-items: center; gap: 12px;
      padding: 12px 12px 12px 16px; border-radius: 14px;
      background: #2A0710; color: #F6EBD2; border: 1.5px solid #D4A63A;
      box-shadow: 0 8px 28px rgba(0,0,0,.45);
      font: 15px/1.35 -apple-system, system-ui, sans-serif;
    }
    #inapp p { margin: 0; flex: 1; }
    #inapp a, #inapp button {
      flex: none; border: 0; border-radius: 10px; padding: 9px 12px;
      font: 600 14px -apple-system, system-ui, sans-serif; text-decoration: none;
      background: #D4A63A; color: #2A0710; cursor: pointer;
    }
    #inapp button.quiet { background: transparent; color: #D4A63A; padding: 9px 6px; }
  </style>
  <script>
    // Inside another app's browser the game is slower, so it draws fewer
    // pixels there (twice the screen's points at most), and suggests the
    // phone's own browser once.
    (function () {
      var ua = navigator.userAgent || '';
      if (!/FBAN|FBAV|FB_IAB|FBIOS|Messenger|Instagram|Line\/|MicroMessenger|Snapchat|musical_ly|BytedanceWebview|TikTok/i.test(ua)) return;
      if ((window.devicePixelRatio || 1) > 2) {
        try { Object.defineProperty(window, 'devicePixelRatio', { get: function () { return 2; }, configurable: true }); } catch (e) {}
      }
      try { if (sessionStorage.getItem('kingsCourt.inAppNoted')) return; } catch (e) {}
      document.addEventListener('DOMContentLoaded', function () {
        var android = /Android/i.test(ua);
        var note = document.createElement('div');
        note.id = 'inapp';
        note.setAttribute('role', 'note');
        var p = document.createElement('p');
        p.textContent = android
          ? 'The game runs smoother in your browser.'
          : 'The game runs smoother in your browser: tap \u2022\u2022\u2022 at the top and open it there.';
        note.appendChild(p);
        if (android) {
          var a = document.createElement('a');
          var here = location.href.replace(/^https?:\/\//, '');
          // No browser named: the phone's own choice opens it.
          a.href = 'intent://' + here + '#Intent;scheme=https;action=android.intent.action.VIEW;end';
          a.textContent = 'Open in browser';
          note.appendChild(a);
        }
        var ok = document.createElement('button');
        ok.className = android ? 'quiet' : '';
        ok.textContent = android ? 'Not now' : 'Got it';
        ok.onclick = function () {
          note.remove();
          try { sessionStorage.setItem('kingsCourt.inAppNoted', '1'); } catch (e) {}
        };
        note.appendChild(ok);
        document.body.appendChild(note);
      });
    })();
  </script>
</head>
<body>
  <div id="loading" aria-label="Loading The King's Court" role="status">
    <svg viewBox="0 0 100 75" aria-hidden="true">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#F9E08C" style="stop-color: var(--gold-hi, #F9E08C)"/>
          <stop offset=".5" stop-color="#D4A63A" style="stop-color: var(--gold, #D4A63A)"/>
          <stop offset="1" stop-color="#A57C1B" style="stop-color: var(--gold-lo, #A57C1B)"/>
        </linearGradient>
      </defs>
      <path fill="url(#g)" d="M0 18.75 L27 41.25 L50 0 L73 41.25 L100 18.75 L88 61.5 L12 61.5 Z M12 66 H88 V75 H12 Z"/>
    </svg>
    <div class="dots"><i></i><i></i><i></i></div>
  </div>
  <script>
    // Held a moment past the first frame, while the game finds its feet
    // (fonts, the first busy frames), so the fade itself runs smoothly.
    function loaded() {
      setTimeout(function () {
        var l = document.getElementById('loading');
        if (!l || l.classList.contains('done')) return;
        l.classList.add('done');
        setTimeout(function () { l.remove(); }, 800);
      }, 450);
    }
    window.addEventListener('flutter-first-frame', loaded);
    // Never left covering the game, whatever happens.
    setTimeout(loaded, 15000);
    // The game fills the window and never scrolls: some phones' browsers
    // scroll the page when the keyboard comes up, leaving it out of view.
    window.addEventListener('scroll', function () {
      if (window.scrollX || window.scrollY) window.scrollTo(0, 0);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
