<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="The King's Court: a cooperative trick-taking game.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="King's Court">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png"/>
  <meta name="theme-color" content="#4E0B18">

  <title>The King's Court</title>
  <link rel="manifest" href="manifest.json">
  <!-- The dark red table behind everything, so the browser bars and the edges of the
       screen match the table round the felt, and nothing flashes white while
       the game loads. -->
  <style>
    html, body { margin: 0; background: #4E0B18; }
    /* While the game loads: a gold crown on the felt, rising and glowing,
       which fades away as the first frame appears. */
    #loading {
      position: fixed; inset: 7px; border-radius: 16px;
      background: radial-gradient(circle at 50% 45%, #176141, #0A3622 70%);
      box-shadow: inset 0 0 0 1.5px rgba(212,166,58,.8);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 10; transition: opacity .7s ease; will-change: opacity;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading svg {
      width: 96px; filter: drop-shadow(0 0 14px rgba(212,166,58,.55));
      animation: rise 1.6s ease-in-out infinite;
      will-change: transform;
    }
    #loading .dots { margin-top: 22px; display: flex; gap: 9px; }
    #loading .dots i {
      width: 8px; height: 8px; border-radius: 50%; background: #D4A63A;
      animation: blink 1.2s ease-in-out infinite;
    }
    #loading .dots i:nth-child(2) { animation-delay: .2s; }
    #loading .dots i:nth-child(3) { animation-delay: .4s; }
    @keyframes rise {
      0%, 100% { transform: translateY(4px) scale(.96); opacity: .85; }
      50% { transform: translateY(-6px) scale(1.04); opacity: 1; }
    }
    @keyframes blink { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      #loading svg, #loading .dots i { animation: none; }
    }
  </style>
</head>
<body>
  <div id="loading" aria-label="Loading The King's Court" role="status">
    <svg viewBox="0 0 100 75" aria-hidden="true">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#F9E08C"/><stop offset=".5" stop-color="#D4A63A"/>
          <stop offset="1" stop-color="#A57C1B"/>
        </linearGradient>
      </defs>
      <path fill="url(#g)" d="M0 18.75 L27 41.25 L50 0 L73 41.25 L100 18.75 L88 61.5 L12 61.5 Z M12 66 H88 V75 H12 Z"/>
    </svg>
    <div class="dots"><i></i><i></i><i></i></div>
  </div>
  <script>
    // Held a moment past the first frame, while the game finds its feet
    // (fonts, the first busy frames), so the fade itself runs smoothly.
    function loaded() {
      setTimeout(function () {
        var l = document.getElementById('loading');
        if (!l || l.classList.contains('done')) return;
        l.classList.add('done');
        setTimeout(function () { l.remove(); }, 800);
      }, 450);
    }
    window.addEventListener('flutter-first-frame', loaded);
    // Never left covering the game, whatever happens.
    setTimeout(loaded, 15000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
